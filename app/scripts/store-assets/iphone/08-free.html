<body>
<script>

  <div class="copy" style="top:116px"><h1 class="headline" style="font-size:40px">Free.<br><em>Every feature.</em></h1></div>
  <div style="position:absolute;left:0;right:0;top:216px;display:flex;justify-content:center;z-index:6">${Free.pill(0.9)}</div>
  <div style="position:absolute;left:22px;right:22px;top:284px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px">
    ${Free.FEATURES.map((f) => Free.tile(f, 0.86)).join('')}
  </div>
</div>`);
</script>
