plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  // Classpath is added to the root build.gradle by app.plugin.js.
  id 'com.chaquo.python'
}

group = 'dev.tide.pythonruntime'
version = '0.1.0'

android {
  namespace "dev.tide.pythonruntime"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk {
      // Chaquopy ships Python 3.13+ for 64-bit ABIs only.
      abiFilters "arm64-v8a", "x86_64"
    }
  }
  lintOptions {
    abortOnError false
  }
}

chaquopy {
  defaultConfig {
    version = "3.15"
    // Skips the need for a matching Python 3.15 on the build machine.
    pyc {
      src = false
    }
    // Jedi lists typeshed's .pyi folders and parso opens its grammar files by
    // path, which needs real files rather than APK assets.
    extractPackages("jedi", "parso")
  }
  sourceSets {
    main {
      srcDir "../python"
    }
  }
}
