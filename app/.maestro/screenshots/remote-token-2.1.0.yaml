# #22 the remote server token field: no SMS code suggestion above the keyboard.
# Separate from ios-2.1.0.yaml so a failure in one doesn't lose the other's shots.
# Params: SIZE
appId: com.thisiskurubaran.tide
name: Screenshot of the remote token field
tags:
  - screenshots
---
- launchApp
- runFlow:
    when:
      visible:
        id: back
    commands:
      - tapOn:
          id: back
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: settings-remote
- tapOn:
    id: settings-remote
- tapOn:
    id: remote-token
- takeScreenshot: ${SIZE}-11-remote-token-field
